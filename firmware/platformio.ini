; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = ESP32-S3-DevKitC-1  ; `pio run` / upload build the dongle firmware only

[env:ESP32-S3-DevKitC-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-D USER_SETUP_LOADED
	-D USE_HSPI_PORT
	-D ST7735_DRIVER
	-D SPI_FREQUENCY=50000000
	-D TFT_MISO=-1
	-D TFT_MOSI=3
	-D TFT_SCLK=5
	-D TFT_CS=4
	-D TFT_DC=2
	-D TFT_RST=1
	-D TFT_WIDTH=80
	-D TFT_HEIGHT=160
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-D ST7735_GREENTAB160x80
	-D TFT_RGB_ORDER=TFT_BGR
	-D CONFIG_FATFS_MAX_OPEN_FILES=64
lib_deps = 
	bodmer/TFT_eSPI @ ^2.4.75
	esp32async/ESPAsyncWebServer
	esp32async/AsyncTCP
	mikalhart/TinyGPSPlus@^1.1.0
	bblanchon/ArduinoJson@^7.1.0
	https://github.com/ricmoo/QRCode
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<.git/> -<.svn/> -<test/>  ; test/ holds PC-only unit tests
monitor_filters = esp32_exception_decoder

; Firmware helpers tested on the PC (no dongle needed): ~/.platformio/penv/bin/pio test -e native
; Needs a host C++ compiler (g++). Only test/ is built: the firmware sources need the ESP32.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -I include
